[project]
name = "sanka-extension-sqlite"
version = "0.1.0a15"
description = "SQLite data extension for the Sanka migration runtime"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Sanka, Inc." }]
dependencies = ["sanka-extension-sdk==0.1.0a4"]

[project.entry-points."sanka.connectors"]
sqlite = "sanka_extension_sqlite:EXTENSION"

[project.urls]
Repository = "https://github.com/sankaHQ/extensions"
Issues = "https://github.com/sankaHQ/extensions/issues"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sanka_extension_sqlite", "src/sanka_connector_sqlite"]
