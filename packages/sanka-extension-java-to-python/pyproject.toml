[project]
name = "sanka-extension-java-to-python"
version = "0.1.0a2"
description = "Review-bound Spring MVC migration to Python FastAPI"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["sanka-java-migration==0.1.0a2", "sanka-extension-sdk==0.1.0a4", "sanka-http-replay==0.1.0a2"]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sanka_extension_java_to_python"]

[project.scripts]
sanka-extension-java-to-python = "sanka_extension_java_to_python.__main__:main"
