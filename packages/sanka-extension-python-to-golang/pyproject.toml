[project]
name = "sanka-extension-python-to-golang"
version = "0.1.0a8"
description = "Deterministic Python to Golang migration extension (experimental)"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["sanka-extension-sdk==0.1.0a4", "sanka-http-replay==0.1.0a2"]

[project.scripts]
sanka-extension-python-to-golang = "sanka_extension_python_to_golang.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sanka_extension_python_to_golang"]
