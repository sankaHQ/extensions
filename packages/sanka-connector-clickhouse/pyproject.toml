[project]
name = "sanka-connector-clickhouse"
version = "0.1.0a10"
description = "ClickHouse connector for the Sanka migration runtime"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Sanka, Inc." }]
dependencies = ["clickhouse-connect>=0.8", "sanka-connector-sdk==0.1.0a10"]

[project.entry-points."sanka.connectors"]
clickhouse = "sanka_connector_clickhouse:CONNECTOR"

[project.urls]
Repository = "https://github.com/sankaHQ/sanka-extensions"
Issues = "https://github.com/sankaHQ/sanka-extensions/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sanka_connector_clickhouse"]
