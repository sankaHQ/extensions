[project]
name = "sanka-extension-sales-quote"
version = "0.1.0a1"
description = "Isolated Sales draft Quote Blueprint generator for Sanka Flow"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Sanka, Inc." }]
dependencies = ["sanka-extension-sdk==0.1.0a3"]

[project.scripts]
sanka-extension-sales-quote = "sanka_extension_sales_quote.__main__:main"

[project.urls]
Repository = "https://github.com/sankaHQ/extensions"
Issues = "https://github.com/sankaHQ/extensions/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sanka_extension_sales_quote"]
