[project]
name = "sanka-extension-php-to-golang"
version = "0.1.0a1"
description = "Review-bound PHP API migration to chi"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["sanka-php-migration==0.1.0a1"]

[project.scripts]
sanka-extension-php-to-golang = "sanka_extension_php_to_golang.__main__:main"

[project.urls]
Repository = "https://github.com/sankaHQ/extensions"
Issues = "https://github.com/sankaHQ/extensions/issues"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sanka_extension_php_to_golang"]
