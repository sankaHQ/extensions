[project]
name = "sanka-connector-csv"
version = "0.1.0a10"
description = "CSV connector for the Sanka migration runtime"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Sanka, Inc." }]
dependencies = ["sanka-connector-sdk==0.1.0a10"]

[project.entry-points."sanka.connectors"]
csv = "sanka_connector_csv:CONNECTOR"

[project.urls]
Repository = "https://github.com/sankaHQ/sanka-connectors"
Issues = "https://github.com/sankaHQ/sanka-connectors/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sanka_connector_csv"]
