[project]
name = "sanka-connector-salesforce"
version = "0.1.0a9"
description = "Salesforce connector for the Sanka migration runtime"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Sanka, Inc." }]
dependencies = ["httpx>=0.27,<1", "sanka-connector-sdk==0.1.0a9"]

[project.entry-points."sanka.connectors"]
salesforce = "sanka_connector_salesforce:CONNECTOR"

[project.urls]
Repository = "https://github.com/sankaHQ/sanka-connectors"
Issues = "https://github.com/sankaHQ/sanka-connectors/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sanka_connector_salesforce"]
