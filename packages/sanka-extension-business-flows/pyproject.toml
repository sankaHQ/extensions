[project]
name = "sanka-extension-business-flows"
version = "0.1.0a1"
description = "Versioned business recipe definitions and isolated Flow blueprint generation"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Sanka, Inc." }]
dependencies = ["sanka-extension-sdk==0.1.0a5"]

[project.scripts]
sanka-extension-business-flows = "sanka_extension_business_flows.__main__:main"

[project.urls]
Repository = "https://github.com/sankaHQ/extensions"
Issues = "https://github.com/sankaHQ/extensions/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sanka_extension_business_flows"]
# SDK a7 candidates stay source-only until the SDK is published and this package
# receives its next reviewed version and manifest. Preserve the released a1 bytes.
exclude = [
    "src/sanka_extension_business_flows/native_generator.py",
    "src/sanka_extension_business_flows/native_parameters.py",
    "src/sanka_extension_business_flows/native_recipes.py",
]
