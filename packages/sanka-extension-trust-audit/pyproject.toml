[project]
name = "sanka-extension-trust-audit"
version = "0.1.0a2"
description = "Find and patch repository trust in the compromised eMudhra certificate authorities"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["sanka-extension-sdk==0.1.0a4"]

[project.scripts]
sanka-extension-trust-audit = "sanka_extension_trust_audit.__main__:main"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sanka_extension_trust_audit"]
