[project]
name = "sanka-extension-drf-to-fastapi"
version = "0.1.0a1"
description = "Isolated DRF-to-FastAPI migration extension for Sanka"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Sanka, Inc." }]
dependencies = ["sanka-extension-sdk==0.1.0a1"]

[project.scripts]
sanka-extension-drf-to-fastapi = "sanka_extension_drf_to_fastapi.__main__:main"

[project.urls]
Repository = "https://github.com/sankaHQ/extensions"
Issues = "https://github.com/sankaHQ/extensions/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sanka_extension_drf_to_fastapi"]
