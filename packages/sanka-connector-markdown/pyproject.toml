[project]
name = "sanka-connector-markdown"
version = "0.1.0a10"
description = "Markdown connector for the Sanka migration runtime"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Sanka, Inc." }]
dependencies = ["pyyaml>=6", "sanka-connector-sdk==0.1.0a10"]

[project.entry-points."sanka.connectors"]
markdown = "sanka_connector_markdown:CONNECTOR"

[project.urls]
Repository = "https://github.com/sankaHQ/mods"
Issues = "https://github.com/sankaHQ/mods/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sanka_connector_markdown"]
