[project]
name = "sanka-extension-markdown"
version = "0.1.0a15"
description = "Markdown data extension for the Sanka migration runtime"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Sanka, Inc." }]
dependencies = ["pyyaml>=6", "sanka-extension-sdk==0.1.0a4"]

[project.entry-points."sanka.connectors"]
markdown = "sanka_extension_markdown:EXTENSION"

[project.urls]
Repository = "https://github.com/sankaHQ/extensions"
Issues = "https://github.com/sankaHQ/extensions/issues"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sanka_extension_markdown", "src/sanka_connector_markdown"]
