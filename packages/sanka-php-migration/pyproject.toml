[project]
name = "sanka-php-migration"
version = "0.1.0a1"
description = "Static PHP API capture and native target generation for Sanka Cloud"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "sanka-code-migration==0.1.0a5",
  "sanka-extension-sdk==0.1.0a4",
  "sanka-http-replay==0.1.0a2",
  "tree-sitter==0.25.2",
  "tree-sitter-php==0.24.1",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sanka_php_migration"]
