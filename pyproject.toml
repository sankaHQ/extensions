[project]
name = "sanka-extensions-workspace"
version = "0.0.0"
description = "Development workspace for Sanka extension SDKs and packages"
license = "Apache-2.0"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
sanka-connector-sdk = { workspace = true }
sanka-extension-sdk = { workspace = true }

[dependency-groups]
dev = [
  "mypy>=1.14",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.12",
  "types-pyyaml>=6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = [
  "sanka_connector",
  "sanka_connector_clickhouse",
  "sanka_connector_csv",
  "sanka_connector_markdown",
  "sanka_connector_postgres",
  "sanka_connector_sqlite",
  "sanka_extension_sdk",
]

[tool.mypy]
strict = true
python_version = "3.12"
namespace_packages = true
explicit_package_bases = true
exclude = ["packages/.*/tests/"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["packages"]
