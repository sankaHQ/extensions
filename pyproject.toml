[project]
name = "sanka-extensions-workspace"
version = "0.0.0"
description = "Development workspace for Sanka extension SDKs and packages"
license = "Apache-2.0"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
sanka-connector-sdk = { workspace = true }
sanka-extension-sdk = { workspace = true }

[dependency-groups]
dev = [
  "aiosqlite>=0.20,<1",
  "django>=5.2,<7",
  "djangorestframework>=3.16,<4",
  "fastapi>=0.115,<1",
  "flask>=3.1,<4",
  "httpx>=0.27,<1",
  "mypy>=1.14",
  "psycopg[binary]>=3.2,<4",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pyyaml>=6",
  "ruff>=0.12",
  "sqlalchemy>=2.0,<3",
  "tortoise-orm>=1.1,<2",
  "types-pyyaml>=6",
  "uvicorn[standard]>=0.30,<1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Copied synthetic Django applications used as scan fixtures keep their original
# idioms (mutable class attributes are how DRF views are written).
"packages/*/tests/fixtures/**" = ["RUF012"]

[tool.ruff.lint.isort]
known-first-party = [
  "sanka_connector",
  "sanka_connector_clickhouse",
  "sanka_connector_csv",
  "sanka_connector_markdown",
  "sanka_connector_postgres",
  "sanka_connector_sqlite",
  "sanka_extension_sdk",
  "sanka_extension_drf_to_fastapi",
  "sanka_extension_drf_to_flask",
]

[tool.mypy]
strict = true
python_version = "3.12"
namespace_packages = true
explicit_package_bases = true
exclude = ["packages/.*/tests/"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["packages", "tests"]
