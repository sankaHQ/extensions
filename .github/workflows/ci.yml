name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sanka
          POSTGRES_PASSWORD: sanka
          POSTGRES_DB: sanka_migrate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sanka"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        env:
          CLICKHOUSE_SKIP_USER_SETUP: "1"
        ports:
          - 8123:8123
        options: >-
          --health-cmd "wget -qO- http://localhost:8123/ping || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SANKA_MIGRATE_TEST_POSTGRES_DSN: postgresql://sanka:sanka@localhost:5432/sanka_migrate_test
      SANKA_MIGRATE_TEST_CLICKHOUSE_URL: http://localhost:8123/default
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.21"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --all-packages
      - name: Validate native Flask database setup and Django schema adoption
        run: uv run python -m pytest packages/sanka-extension-drf-to-flask/tests/test_database_postgres.py -q
      - name: Compare native Flask HTTP and database effects on PostgreSQL
        run: >-
          uv run python -m pytest
          packages/sanka-extension-drf-to-flask/tests/test_sqlalchemy_auth.py
          packages/sanka-extension-drf-to-flask/tests/test_sqlalchemy_records.py
          packages/sanka-extension-drf-to-flask/tests/test_sqlalchemy_response_overrides.py
          packages/sanka-extension-drf-to-flask/tests/test_sqlalchemy_listing.py
          packages/sanka-extension-drf-to-flask/tests/test_sqlalchemy_nested.py
          packages/sanka-extension-drf-to-flask/tests/test_sqlalchemy_filters.py
          packages/sanka-extension-drf-to-flask/tests/test_sqlalchemy_sessions.py
          -k postgresql -q
      - run: make check
      - run: make build-release
      - run: make build-business-flows
      - name: Install the actual Flask candidate and its published SDK dependencies
        run: uv --no-config pip install --reinstall --no-index --find-links dist dist/sanka_extension_drf_to_flask-*.whl
      - name: Verify installed Flask wheels with native lifecycle and database parity
        run: |
          uv run --no-sync python -c "import pathlib, sys, importlib.metadata, sanka_extension_drf_to_flask, sanka_code_migration; assert importlib.metadata.version('sanka-extension-sdk') == '0.1.0a4'; root = pathlib.Path(sys.prefix).resolve(); assert all(pathlib.Path(m.__file__).resolve().is_relative_to(root) for m in (sanka_extension_drf_to_flask, sanka_code_migration))"
          uv run --no-sync python -m pytest \
            packages/sanka-extension-drf-to-flask/tests/test_native_plan.py \
            packages/sanka-extension-drf-to-flask/tests/test_sqlalchemy_auth.py \
            packages/sanka-extension-drf-to-flask/tests/test_sqlalchemy_response_overrides.py \
            packages/sanka-extension-drf-to-flask/tests/test_sqlalchemy_listing.py \
            packages/sanka-extension-drf-to-flask/tests/test_sqlalchemy_nested.py \
            packages/sanka-extension-drf-to-flask/tests/test_sqlalchemy_filters.py \
            packages/sanka-extension-drf-to-flask/tests/test_sqlalchemy_requests.py \
            packages/sanka-extension-drf-to-flask/tests/test_behavior_inventory_plan.py \
            packages/sanka-extension-drf-to-flask/tests/test_session_lifecycle.py \
            packages/sanka-extension-drf-to-flask/tests/test_sqlalchemy_csrf.py \
            packages/sanka-extension-drf-to-flask/tests/test_sqlalchemy_sessions.py

  modern-drf:
    name: Django 6 DRF conversion parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.21"
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen --all-packages
      - name: Install the declared modern source framework versions
        run: uv pip install 'django==6.0.6' 'djangorestframework==3.17.1'
      - name: Compare real source and generated HTTP responses and database effects
        run: uv run --no-sync python -m pytest packages/sanka-extension-drf-to-fastapi/tests/test_big_integer.py packages/sanka-extension-drf-to-fastapi/tests/test_generic_views.py packages/sanka-extension-drf-to-fastapi/tests/test_uuid_boolean.py packages/sanka-extension-drf-to-fastapi/tests/test_access_contracts.py
      - name: Compare standalone Flask contracts against the modern DRF source
        run: >-
          uv run --no-sync python -m pytest
          packages/sanka-extension-drf-to-flask/tests/test_sqlalchemy.py
          packages/sanka-extension-drf-to-flask/tests/test_sqlalchemy_auth.py
          packages/sanka-extension-drf-to-flask/tests/test_sqlalchemy_nested.py
          packages/sanka-extension-drf-to-flask/tests/test_sqlalchemy_middleware.py
          packages/sanka-extension-drf-to-flask/tests/test_sqlalchemy_deletion.py
          packages/sanka-extension-drf-to-flask/tests/test_sqlalchemy_listing.py
          packages/sanka-extension-drf-to-flask/tests/test_sqlalchemy_access.py
          packages/sanka-extension-drf-to-flask/tests/test_sqlalchemy_records.py
          packages/sanka-extension-drf-to-flask/tests/test_sqlalchemy_datetime.py
          packages/sanka-extension-drf-to-flask/tests/test_validator_qualification.py
          packages/sanka-extension-drf-to-flask/tests/test_sqlalchemy_response_overrides.py
          packages/sanka-extension-drf-to-flask/tests/test_sqlalchemy_filters.py
          packages/sanka-extension-drf-to-flask/tests/test_sqlalchemy_sessions.py
          packages/sanka-extension-drf-to-flask/tests/test_sqlalchemy_requests.py
          packages/sanka-extension-drf-to-flask/tests/test_sqlalchemy_csrf.py
