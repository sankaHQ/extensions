name: Publish Business Flow definitions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.11.21"
          python-version: "3.12"
      - name: Require the reviewed release tag
        run: test "$GITHUB_REF_TYPE" = tag && test "$GITHUB_REF_NAME" = business-flows-v0.1.0a1
      - run: uv sync --frozen --all-packages
      - run: make check build-business-flows
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: business-flows
          path: release/business-flows/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: business-flows
          path: release/
      - name: Publish immutable definition artifacts
        run: >-
          gh release create "$GITHUB_REF_NAME" release/*
          --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease
          --title "Business Flow definitions 0.1.0a1"
          --notes "Nine categories and 28 recipe definitions. One HubSpot order/billing Blueprint generator. Requires CLI 0.2.13 or later. Native execution, verification and activation require a hosted adapter; this package performs no provider operations."
        env:
          GH_TOKEN: ${{ github.token }}
