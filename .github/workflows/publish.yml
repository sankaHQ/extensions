name: Publish extension marketplace

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify marketplace wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.21"
          python-version: "3.12"
          enable-cache: true
      - run: test "$GITHUB_REF_TYPE" = tag && test "$GITHUB_REF_NAME" = extensions-v0.1.0a20
      - run: uv sync --frozen --all-packages
      - run: make check
      - run: uv run python scripts/build_release.py --output-dir dist
      - run: uv run python scripts/check_release_artifacts.py dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: marketplace-${{ github.ref_name }}
          path: |
            dist/*.whl
            marketplace.json
            packages/*/extension.json
          if-no-files-found: error
          retention-days: 14

  sdk:
    name: Publish the SDK before implementing packages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: marketplace-${{ github.ref_name }}
          path: .
      - name: Pin the SDK tag to this reviewed source
        run: python3 scripts/ensure_sdk_release_tag.py "$GITHUB_SHA"
      - name: Publish the exact SDK wheels
        run: >-
          gh release create sdk-v0.1.0a4
          dist/sanka_connector_sdk-0.1.0a12-py3-none-any.whl
          dist/sanka_extension_sdk-0.1.0a4-py3-none-any.whl
          --verify-tag --repo "$GITHUB_REPOSITORY"
          --prerelease --title "Sanka Extension SDK 0.1.0a4"
          --notes "Typed Flow generator protocol. Native execution and runtime adoption are separate releases."
        env:
          GH_TOKEN: ${{ github.token }}

  release:
    name: Attach marketplace artifacts to GitHub release
    needs: [build, sdk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: marketplace-${{ github.ref_name }}
          path: .
      - name: Stage uniquely named marketplace manifests
        run: |
          mkdir release-assets
          cp marketplace.json release-assets/marketplace.json
          cp packages/sanka-extension-drf-to-fastapi/extension.json release-assets/sanka-extension-drf-to-fastapi.json
          cp packages/sanka-extension-drf-to-flask/extension.json release-assets/sanka-extension-drf-to-flask.json
          cp packages/sanka-connector-markdown/extension.json release-assets/sanka-connector-markdown.json
          cp packages/sanka-connector-csv/extension.json release-assets/sanka-connector-csv.json
          cp packages/sanka-connector-sqlite/extension.json release-assets/sanka-connector-sqlite.json
          cp packages/sanka-connector-postgres/extension.json release-assets/sanka-connector-postgres.json
          cp packages/sanka-connector-clickhouse/extension.json release-assets/sanka-connector-clickhouse.json
      - run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/*.whl
          release-assets/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag --prerelease --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
