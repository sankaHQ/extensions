name: Publish extension marketplace

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extension-marketplace-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify marketplace wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.21"
          python-version: "3.12"
          enable-cache: true
      - run: test "$GITHUB_REF_TYPE" = tag && test "$GITHUB_REF_NAME" = extensions-v0.1.0a19
      - run: uv sync --frozen --all-packages
      - run: make check
      - run: uv run python scripts/build_release.py --output-dir dist
      - run: uv run python scripts/check_release_artifacts.py dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: marketplace-${{ github.ref_name }}
          path: |
            dist/*.whl
            marketplace.json
            flow-marketplace.json
            packages/*/extension.json
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach marketplace artifacts to GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.21"
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: marketplace-${{ github.ref_name }}
          path: .
      - name: Publish SDK before implementing extensions with public readback
        run: >-
          uv run --no-project --python 3.12 python scripts/publish_release.py
          --tag "$GITHUB_REF_NAME" --revision "$GITHUB_SHA" --dist dist --publish
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: publication-evidence-${{ github.ref_name }}-${{ github.run_attempt }}
          path: release/publication-evidence.json
          if-no-files-found: warn
          retention-days: 90
